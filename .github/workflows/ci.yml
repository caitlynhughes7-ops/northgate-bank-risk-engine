name: ECL migration checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: ruff check python tools
      - run: PYTHONPATH=python pytest -q
      - run: PYTHONPATH=python python tools/regression_harness.py
      - uses: actions/upload-artifact@v4
        with:
          name: parity-202409
          path: data/output/parity_202409.json
