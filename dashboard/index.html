<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Northgate Bank &mdash; IFRS 9 Provision Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="mark">NB</span>
    <div>
      <h1>Group Credit Risk &mdash; IFRS 9 Provision Dashboard</h1>
      <p class="sub">Reporting period <strong id="period">2024-09</strong> &middot; Retail &amp; SME lending</p>
    </div>
  </div>
  <div class="src">
    <label for="source">Engine</label>
    <select id="source">
      <option value="expected">Legacy SAS engine</option>
      <option value="output">Migrated engine</option>
      <option value="compare">Compare (variance)</option>
    </select>
  </div>
</header>

<main>
  <section class="cards">
    <div class="card"><h2>Total EAD</h2><p id="kpi-ead">&mdash;</p></div>
    <div class="card"><h2>Total ECL</h2><p id="kpi-ecl">&mdash;</p></div>
    <div class="card"><h2>Coverage ratio</h2><p id="kpi-cov">&mdash;</p></div>
    <div class="card"><h2>Stage 2 + 3 EAD</h2><p id="kpi-s23">&mdash;</p></div>
  </section>

  <section class="panel">
    <h3>ECL by segment</h3>
    <div id="chart" class="chart"></div>
  </section>

  <section class="panel">
    <h3>Provision by segment and stage</h3>
    <table id="grid">
      <thead></thead>
      <tbody></tbody>
    </table>
    <p class="note" id="status"></p>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
